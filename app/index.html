<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trellis</title>
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f3f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
<style>
/* The fonts ship with the page: no font host learns who reads. */
@font-face { font-family: "Spectral"; font-weight: 600; font-display: swap; src: url(./fonts/spectral-600.woff2) format("woff2"); }
@font-face { font-family: "Public Sans"; font-weight: 400 600; font-display: swap; src: url(./fonts/public-sans.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap; src: url(./fonts/jetbrains-mono-400.woff2) format("woff2"); }
:root {
  --bg: #f3f4f2; --surface: #ffffff; --ink: #1d2422; --muted: #5d6764; --line: #dde1de;
  --accent: #2f7d6d; --accent-soft: #e2efeb; --on-accent: #ffffff; --down: #9a5b45;
  --add: #e3f2ea; --add-ink: #1f6a43; --del: #f8e7e2; --del-ink: #9a3c25; --hunk: #eef1f4;
  --display: "Spectral", Georgia, serif; --body: "Public Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #121615; --surface: #1a201e; --ink: #e5ebe8; --muted: #9aa5a1; --line: #2b3331;
  --accent: #5fb8a3; --accent-soft: #1f3530; --on-accent: #0b1714; --down: #d08b72;
  --add: #16301f; --add-ink: #7fd3a0; --del: #3a1f19; --del-ink: #f0a28c; --hunk: #1f2629; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.mono, code, pre, .code { font-family: var(--mono); font-size: 12.5px; font-variant-ligatures: none; tab-size: 4; }
.muted { color: var(--muted); }
.app { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
header.top { display: flex; align-items: center; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; text-decoration: none; font: 600 20px var(--display); }
.brand svg { width: 22px; height: 22px; stroke: var(--accent); stroke-width: 1.6; fill: none; }
header.top nav a { color: var(--muted); text-decoration: none; font-size: 14px; } header.top nav a:hover { color: var(--accent); }
main { min-width: 0; }
main[aria-busy="true"] { opacity: .7; transition: opacity .2s .3s; }
h1 { font: 600 26px/1.2 var(--display); margin: 20px 0 4px; overflow-wrap: anywhere; }
h1 a { text-decoration: none; } h1 a:hover { color: var(--accent); }
h2 { font: 600 19px/1.3 var(--display); margin: 0 0 8px; }
.lede { color: var(--muted); margin: 4px 0 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 22px; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 2px 9px; font-size: 13px; line-height: 20px; }
.btn.more { margin-top: 16px; }
input[type=search], input[type=url], input[type=text], select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
input[type=search], .panel input { width: 100%; }
label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 4px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.row2 { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-top: 16px; }
.panel.bad { border-color: var(--down); }
.empty { padding: 24px 0; color: var(--muted); }
.badge { display: inline-block; font: 12px var(--body); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--muted); vertical-align: middle; }
.repos, .entries, .commits, .refs { list-style: none; margin: 12px 0 0; padding: 0; }
.repos { border-top: 1px solid var(--line); }
.repo-row { padding: 14px 0; border-bottom: 1px solid var(--line); }
.repo-row p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.repo-name { font: 600 17px var(--display); text-decoration: none; } .repo-name:hover { color: var(--accent); }
.tabs { display: flex; gap: 4px; margin: 8px 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { padding: 8px 12px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--ink); border-color: var(--accent); font-weight: 600; }
.tab:hover { color: var(--ink); }
.bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.bar select { max-width: 220px; }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; font-size: 15px; overflow-wrap: anywhere; }
.crumbs a { text-decoration: none; color: var(--accent); } .crumbs a:hover { text-decoration: underline; }
.files { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.latest { display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: baseline; padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 14px; }
.latest a { text-decoration: none; } .latest a:hover { color: var(--accent); text-decoration: underline; }
.latest .count { margin-left: auto; font-weight: 600; }
.entries { margin: 0; }
.entry { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.entry:first-child { border-top: 0; }
.entry svg { width: 16px; height: 16px; flex: none; stroke: var(--muted); stroke-width: 1.3; }
.entry.tree svg { fill: var(--accent-soft); stroke: var(--accent); }
.entry a { text-decoration: none; overflow-wrap: anywhere; } .entry a:hover { color: var(--accent); text-decoration: underline; }
.readme { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 4px 20px 16px; }
.readme > h2 { font: 600 13px var(--body); color: var(--muted); padding: 10px 0; margin: 0 0 8px; border-bottom: 1px solid var(--line); }
.markdown { overflow-wrap: anywhere; }
.markdown h1 { font-size: 24px; margin: 16px 0 8px; } .markdown h2 { margin-top: 20px; }
.markdown pre { background: var(--bg); padding: 12px; border-radius: 6px; overflow-x: auto; }
.markdown code { background: var(--bg); padding: 1px 4px; border-radius: 4px; } .markdown pre code { padding: 0; background: none; }
.markdown img { max-width: 100%; }
.markdown table { border-collapse: collapse; } .markdown td, .markdown th { border: 1px solid var(--line); padding: 4px 10px; }
.markdown a { color: var(--accent); }
pre.plain, pre.message { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0; }
details.clone { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 14px; }
details.clone summary { cursor: pointer; font-weight: 600; }
pre.cmd { background: var(--bg); padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0 0; }
.file-meta { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.file-meta .btn { margin-left: auto; }
.toggle { margin: 0 0 8px; font-size: 13px; }
.image { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 16px; text-align: center; }
.image img { max-width: 100%; }
table.code { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: block; overflow-x: auto; }
table.code tbody { display: table; width: 100%; }
.code td { padding: 0 10px; white-space: pre; line-height: 20px; vertical-align: top; }
.code .ln { width: 1%; text-align: right; color: var(--muted); user-select: none; }
.code .ln::before { content: attr(data-n); }
.code .src { width: 100%; }
.code tr.add { background: var(--add); } .code tr.add .src { color: var(--add-ink); }
.code tr.del { background: var(--del); } .code tr.del .src { color: var(--del-ink); }
.code tr.hunk td { background: var(--hunk); color: var(--muted); padding: 2px 10px; }
.code .op { display: inline-block; width: 1.5ch; user-select: none; }
.day { font: 600 13px var(--body); color: var(--muted); margin: 18px 0 6px; }
.commits, .refs { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 0; }
.commit-row, .ref-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; }
.commit-row:first-child, .ref-row:first-child { border-top: 0; }
.commit-row .subject, .ref-name { font-weight: 600; text-decoration: none; overflow-wrap: anywhere; } .commit-row .subject:hover, .ref-name:hover { color: var(--accent); }
.commit-row .muted, .ref-row .muted { grid-column: 1; font-size: 13px; }
.commit-row .id, .ref-row .id { grid-row: 1 / 3; grid-column: 2; align-self: center; color: var(--muted); }
.commit { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 16px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 13.5px; margin: 12px 0 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.kv a { color: var(--accent); }
.summary { margin: 16px 0 8px; font-size: 14px; }
.add { color: var(--add-ink); } .del { color: var(--del-ink); }
.diff { margin-top: 12px; }
.diff h3 { display: flex; gap: 8px; align-items: center; font: 600 14px var(--mono); margin: 0 0 6px; overflow-wrap: anywhere; }
.diff h3 a { text-decoration: none; } .diff h3 a:hover { color: var(--accent); text-decoration: underline; }
.diff .counts { margin-left: auto; font-weight: 400; }
.note { margin: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13px; }
.loading { margin-top: 16px; }
@media (max-width: 600px) { h1 { font-size: 22px; } .latest .count { margin-left: 0; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21L21 3M3 13L13 3M11 21L21 11M3 3l18 18M3 11l10 10M11 3l10 10"/></svg>Trellis</a>
    <nav><a href="#/settings">Settings</a></nav>
  </header>
  <main aria-live="polite"></main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
